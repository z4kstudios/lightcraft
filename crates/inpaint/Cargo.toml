[package]
name = "lightcraft-inpaint"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft AI Remove: LaMa inpainting in pure Rust on candle (L3)"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }

# the model runs natively only (the web build has no AI Remove)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
zip = { version = "7.2", default-features = false }
lightcraft-fetch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
